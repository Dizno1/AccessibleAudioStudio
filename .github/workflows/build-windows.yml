name: Build Windows Installer

# Builds AccessibleAudioStudio's actual .msi and .exe on a real, GitHub-hosted
# Windows machine (windows-latest) — not a simulation, not a placeholder. This
# exists because producing a genuine Windows installer requires Windows itself;
# it cannot be done inside a Linux development sandbox.
#
# Push a tag like "v1.0.0" to build the installers AND publish them as a draft
# GitHub Release automatically (see README.md, "GitHub Releases"). Or run this
# workflow manually (Actions tab > Build Windows Installer > Run workflow) to
# just build and download the installers as workflow artifacts, without
# creating a release — useful for testing a change before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Build installers and publish a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AccessibleAudioStudio ${{ github.ref_name }}"
          releaseBody: "See docs/Roadmap.md for what's included in this release. Download the .msi (recommended) or the .exe setup file below."
          releaseDraft: true
          prerelease: false

      - name: Build installers only (manual run — no release created)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:build

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleAudioStudio-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
