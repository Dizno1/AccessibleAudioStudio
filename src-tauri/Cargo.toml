[package]
name = "accessibleaudiostudio-pro"
version = "0.2.7"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app inside native
# Windows windows. It intentionally contains no application logic of its
# own beyond window/document lifecycle management — the HTML/CSS/JS is
# unmodified except where the window architecture itself required it.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# 0.2.0: architectural rebuild. AccessibleAudioStudio Pro now has two kinds
# of windows: one persistent main "Recording Studio" window (unchanged
# recording/playback/library, index.html), and one independent editor
# window per open audio document (editor.html), created dynamically via
# tauri::WebviewWindowBuilder from Rust — see open_audio_windows,
# open_new_editor_window, and get_editor_init_info in src/main.rs. Alt+Tab
# is now the document-switching mechanism; the single-webview,
# multi-document "Open audio documents" combo box architecture from 0.1.x
# is gone entirely. A new SharedAudioClipboard, managed Tauri state, lets
# Copy in one editor window and Paste in another share audio data across
# separate webviews, which could never happen with a plain JS module
# variable once each document became its own window.
#
# windows (0.1.6 onward, unchanged in 0.2.0): "Open Audio" always shows
# Windows' classic Explorer-style multi-select "Open" dialog via the plain,
# non-COM GetOpenFileNameW API (OFN_EXPLORER | OFN_ALLOWMULTISELECT) — see
# pick_files_native in src/main.rs, completely unchanged by the 0.2.0
# window-architecture rebuild; only what happens with the paths it returns
# is different (one new editor window per path, instead of reading every
# file's bytes into one single-webview response). The dialog hook
# (OFN_ENABLEHOOK/lpfnHook) and window subclass on the File Name control
# that intercepts Ctrl+V to expand a copied Explorer file list (CF_HDROP)
# into GetOpenFileNameW's own quoted multi-name syntax are preserved as-is
# — see the extensive doc comment above pick_files_native for the full
# mechanism and what is and isn't verified about it. Feature list
# (Win32_UI_WindowsAndMessaging, Win32_UI_Shell, Win32_System_DataExchange,
# Win32_System_Ole, Win32_UI_Controls_Dialogs) is unchanged from 0.1.10,
# since none of this Windows-specific code was touched.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: the native "Open Audio" picker, its live paste
# interception, and clipboard file-list reading (see pick_files_native,
# open_dialog_hook_proc, paste_subclass_proc, and read_clipboard_diagnosed
# in src/main.rs). Not needed on other platforms, so it's scoped to the
# windows target rather than pulled in unconditionally.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
]

# Added in 0.2.7.1: used only in pick_files_native (src/main.rs) to obtain
# the main window's real HWND for GetOpenFileNameW's hwndOwner parameter —
# see the doc comment at that call site for why this replaced Tauri's own
# WebviewWindow::hwnd() convenience method, which build #27 (real Windows
# CI) found no longer resolved. Pinned to 0.6 to match the version wry
# 0.36.0+ itself depends on for the same HasWindowHandle trait, per that
# release's own changelog.
[target.'cfg(windows)'.dependencies.raw-window-handle]
version = "0.6"

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
