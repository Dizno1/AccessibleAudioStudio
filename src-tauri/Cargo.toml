[package]
name = "accessibleaudiostudio-pro"
version = "0.1.4"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app (see ../index.html
# and ../app/, which now include the Audio Editor alongside the original
# recording workflow) inside a native Windows window. It intentionally
# contains no application logic of its own — the HTML/CSS/JS is unmodified.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# tauri-plugin-dialog (0.1.4): "Open Audio" now goes through a custom
# command, pick_and_read_audio_files (see src/main.rs), which calls this
# plugin's Rust API (DialogExt) directly and reads every selected file's
# bytes with std::fs — entirely on the Rust side, in one round trip. This
# replaced calling window.__TAURI__.dialog.open({ multiple: true }) from
# JavaScript (0.1.2/0.1.3): real Windows testing, using the Open Audio
# Diagnostics panel that predecessor introduced, proved that approach was
# only ever returning one path to JavaScript regardless of how many files
# were selected — evidence pointing at the dialog call/JS-global-binding
# layer, not at this app's own file-processing code (separately confirmed
# correct by unit tests). Moving the picking AND the reading into one Rust
# command removes that entire suspect layer. tauri-plugin-fs is no longer
# a dependency as of 0.1.4 — file bytes are read with plain std::fs now,
# so nothing in this app calls the fs plugin's own commands anymore.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
