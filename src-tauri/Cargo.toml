[package]
name = "accessibleaudiostudio-pro"
version = "0.1.6"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app (see ../index.html
# and ../app/, which now include the Audio Editor alongside the original
# recording workflow) inside a native Windows window. It intentionally
# contains no application logic of its own — the HTML/CSS/JS is unmodified.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# windows (0.1.6): "Open Audio" now shows Windows' classic Explorer-style
# multi-select "Open" dialog via the plain, non-COM GetOpenFileNameW API
# (OFN_EXPLORER | OFN_ALLOWMULTISELECT) — see pick_files_native in
# src/main.rs — the same class of mechanism Audacity's own Windows build
# uses for this dialog. This replaced 0.1.5's approach (the modern
# IFileOpenDialog COM interface, via the small `wfd` crate), which itself
# had replaced 0.1.2–0.1.4's tauri-plugin-dialog. Real Windows testing
# reported the identical symptom — "returned: 1 file," regardless of
# selection size — for BOTH of those independently-implemented, COM-based
# multi-select APIs, with the Open Audio Diagnostics panel proving every
# stage downstream of the dialog call itself was processing that one file
# correctly both times. GetOpenFileNameW is a deliberately different kind
# of API (a single non-COM function call, no COM interfaces, no COM
# threading-model initialization at all) rather than a third variation on
# the same COM-based mechanism. `wfd` is no longer a dependency.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: the native multi-select "Open Audio" picker (see
# pick_files_native in src/main.rs, GetOpenFileNameW/OPENFILENAMEW). Not
# needed on other platforms, so it's scoped to the windows target rather
# than pulled in unconditionally.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"]

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
