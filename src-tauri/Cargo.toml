[package]
name = "accessibleaudiostudio-pro"
version = "0.1.7"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app (see ../index.html
# and ../app/, which now include the Audio Editor alongside the original
# recording workflow) inside a native Windows window. It intentionally
# contains no application logic of its own — the HTML/CSS/JS is unmodified.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# windows (0.1.6, extended 0.1.7): "Open Audio" shows Windows' classic
# Explorer-style multi-select "Open" dialog via the plain, non-COM
# GetOpenFileNameW API (OFN_EXPLORER | OFN_ALLOWMULTISELECT) — see
# pick_files_native in src/main.rs. 0.1.7 added a second mechanism ahead
# of that dialog: read_clipboard_file_list reads a Windows Shell copied
# file list (CF_HDROP, via OpenClipboard/GetClipboardData/DragQueryFileW)
# when Open Audio is activated, for the "copy files in Explorer, switch
# to this app, Open Audio" workflow — pasting that copied selection into
# the dialog's own File Name field cannot work by design (Explorer's
# multi-file copy never places a text clipboard format, only CF_HDROP;
# see the doc comment on read_clipboard_file_list in src/main.rs for the
# full explanation and source). Feature Win32_UI_Shell added for
# DragQueryFileW; Win32_System_DataExchange for the clipboard functions;
# Win32_System_Ole for the CF_HDROP constant.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: the native "Open Audio" picker and clipboard file-list
# detection (see pick_files_native and read_clipboard_file_list in
# src/main.rs). Not needed on other platforms, so it's scoped to the
# windows target rather than pulled in unconditionally.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
]

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
