[package]
name = "accessibleaudiostudio-pro"
version = "0.1.8"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app (see ../index.html
# and ../app/, which now include the Audio Editor alongside the original
# recording workflow) inside a native Windows window. It intentionally
# contains no application logic of its own — the HTML/CSS/JS is unmodified.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# windows (0.1.6, extended 0.1.7/0.1.8): "Open Audio" always shows Windows'
# classic Explorer-style multi-select "Open" dialog via the plain, non-COM
# GetOpenFileNameW API (OFN_EXPLORER | OFN_ALLOWMULTISELECT) — see
# pick_files_native in src/main.rs. 0.1.7's clipboard-bypass-before-the-
# dialog approach was removed in 0.1.8 after real testing found it produced
# no dialog and no feedback at all; in its place, 0.1.8 installs a dialog
# hook (OFN_ENABLEHOOK/lpfnHook) and a window subclass on the File Name
# control to intercept Ctrl+V live, inside the dialog, and expand a copied
# Explorer file list (CF_HDROP) into the quoted multi-name text
# GetOpenFileNameW's own field already knows how to parse — see the
# extensive doc comment at the top of src/main.rs for the full mechanism,
# and for what is and is not verified about it. Features added for this:
# Win32_UI_WindowsAndMessaging (GetDlgItem, GetParent, WM_NOTIFY, WM_PASTE,
# SetWindowTextW) and Win32_UI_Controls (NMHDR, SetWindowSubclass,
# DefSubclassProc). Win32_UI_Shell, Win32_System_DataExchange, and
# Win32_System_Ole remain from 0.1.7's clipboard-reading code, which 0.1.8
# still uses — now from inside the paste interception instead of before
# the dialog.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: the native "Open Audio" picker, its live paste
# interception, and clipboard file-list reading (see pick_files_native,
# open_dialog_hook_proc, paste_subclass_proc, and read_clipboard_file_list
# in src/main.rs). Not needed on other platforms, so it's scoped to the
# windows target rather than pulled in unconditionally.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
]

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
