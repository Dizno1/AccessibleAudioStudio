[package]
name = "accessibleaudiostudio-pro"
version = "0.1.5"
description = "Professional audio recording and editing designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/ / https://v2.tauri.app for reference.
# This crate hosts the AccessibleAudioStudio Pro web app (see ../index.html
# and ../app/, which now include the Audio Editor alongside the original
# recording workflow) inside a native Windows window. It intentionally
# contains no application logic of its own — the HTML/CSS/JS is unmodified.
#
# Identity is deliberately separate from the free AccessibleAudioStudio
# (different package/bin name, Tauri identifier, and version — see
# ../src-tauri/tauri.conf.json and ../README.md, "Application identity") so
# the two can be installed side by side on the same Windows machine without
# Windows treating a Pro test build as an upgrade of, or collision with, the
# published free edition.
#
# wfd (0.1.5): "Open Audio" now shows Windows' own native multi-select
# file picker (IFileOpenDialog with FOS_ALLOWMULTISELECT, via this crate's
# open_dialog() — see src/main.rs) instead of going through
# tauri-plugin-dialog's cross-platform abstraction at all. Real Windows
# testing of 0.1.2 through 0.1.4 — all of which used tauri-plugin-dialog,
# first from JavaScript and then from Rust directly — consistently
# reported only one file returned regardless of how many were selected,
# with the Open Audio Diagnostics panel proving every stage downstream of
# the dialog call itself was processing that one file correctly. That
# evidence points specifically at tauri-plugin-dialog's Windows dialog
# backend, not at anything in this app — so 0.1.5 replaces it for this one
# function with a small, Windows-only crate that calls the same
# IFileOpenDialog COM API Explorer and Audacity themselves use, directly.
# tauri-plugin-dialog is no longer a dependency.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: the native multi-select "Open Audio" picker (see
# pick_files_native in src/main.rs). Not needed on other platforms, and
# this crate is Windows-specific internally, so it's scoped to the
# windows target rather than pulled in unconditionally.
[target.'cfg(windows)'.dependencies]
wfd = "0.1"

[[bin]]
name = "accessibleaudiostudio-pro"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
